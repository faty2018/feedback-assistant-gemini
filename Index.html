<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6fb; margin: 0; padding: 20px; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-top: 0; }
    .exercice { background: #eef2ff; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    textarea { height: 140px; }
    button { margin-top: 16px; width: 100%; padding: 12px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #message { margin-top: 14px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Assistant de feedback</h1>
    <div class="exercice"><strong>Exercice :</strong> <span id="exercice">Chargement...</span></div>

    <label for="nom">Nom</label>
    <input id="nom" type="text">

    <label for="email">Email</label>
    <input id="email" type="email">

    <label for="reponse">Ta réponse</label>
    <textarea id="reponse"></textarea>

    <button id="btn" onclick="envoyer()">Envoyer</button>
    <div id="message"></div>
  </div>

  <script>
    google.script.run
      .withSuccessHandler(function (texte) {
        document.getElementById('exercice').textContent = texte;
      })
      .getExercice();

    function envoyer() {
      const nom = document.getElementById('nom').value.trim();
      const email = document.getElementById('email').value.trim();
      const reponse = document.getElementById('reponse').value.trim();
      const message = document.getElementById('message');
      const btn = document.getElementById('btn');

      if (!nom || !email || !reponse) {
        message.textContent = 'Merci de remplir tous les champs.';
        return;
      }

      btn.disabled = true;
      message.textContent = 'Envoi en cours...';

      google.script.run
        .withSuccessHandler(function () {
          message.textContent = 'Merci ! Ta réponse a bien été enregistrée ✅';
          document.getElementById('reponse').value = '';
          btn.disabled = false;
        })
        .withFailureHandler(function (erreur) {
          message.textContent = 'Erreur : ' + erreur.message;
          btn.disabled = false;
        })
        .enregistrerReponse(nom, email, reponse);
    }
  </script>
</body>
</html>
